<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="{{url_for('static', filename='style.css')}}">
    <title>Registro Vendas</title>

    <style>
        
        .list-vendas{
            padding-top: 50px;
            text-align: left;
        }
        
        .registro-venda{
            text-align: left;

        }
    </style>
</head>
<body>
    <h1>Fluxo Venda</h1>

    {% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    {% for category, message in messages %}
      <div class="mensagem-{{ category }} flash-msg">
        {{ message }}
      </div>
    {% endfor %}
  {% endif %}
{% endwith %}

    <div class="registro-venda">
        <h2>Registrar Venda:</h2>
        <form action="/registrar_venda" method="POST">
            Valor: <input type="number" name="valor_venda">
            <input type="submit" value="Enviar">
        </form>
    </div>

    <div class="list-vendas">
        <h2>Histórico Vendas: </h2>
        <!-- obs: mostrar só ultimos 3 dias? e ter botao pra carregar historico todo? -->
        <!-- lista do mesmo dia juntas (separa dias com espaço consideravel) e ordena de acordo com a hora (mais recente) -->
        <!-- reutilizar card to estoque? -->

        <div class="div-lista">
            {% for reg in context %}
            <div class="card_valor">
                <span>Registro</span>  <!-- bold e centralizada -->
                <span>{{ reg[0] }}</span>
            </div>
            {% endfor %}
        </div>
    </div>

    <script src="{{ url_for('static',filename='global_script.js') }}"></script>
</body>
</html>
