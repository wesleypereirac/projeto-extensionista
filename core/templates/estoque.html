<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        .cont{
            display: flex;
            flex-direction: row;
            width: 100%;
        }
        body{
            text-align: center;
        }
    </style>
    <title>Estoque</title>
</head>
<body >
     <h2>Estoque</h2>

<div class="cont">

    {% for reg in context %}
    <div class="produto-card">
        <p>
            <!-- <strong>ID:</strong> {{ reg[0] }} <br> -->
            <strong>Nome:</strong> {{ reg[1] }} <br>
            <strong>Valor:</strong> R$ {{ reg[2] }} <br>
            <strong>Qtd:</strong> {{ reg[3] }}
        </p>

        <button type="button" onclick="abrirEdicao({{ reg[0] }})">Editar</button>
        <button type="button" onclick="confirmarDelete({{ reg[0] }}, '{{ reg[1] }}')">Deletar</button>

        <form action="/atualizar" method="POST" id="form-{{ reg[0] }}" style="display: none; margin-top: 10px;">
            <input type="hidden" name="id" value="{{ reg[0] }}">

            <div class="input">
                <input type="text" name="nome" value="{{ reg[1] }}" placeholder="Nome">
            </div>
            <div class="input">
                <input type="number" name="valor" value="{{ reg[2] }}" step="0.01" placeholder="Valor">
            </div>
            <div class="input">
                <input type="number" name="qtd" value="{{ reg[3] }}" placeholder="Quantidade">
            </div>

            <div class="enviar">
                <button type="submit">Salvar</button>
                <button type="button" onclick="fecharEdicao({{ reg[0] }})">Cancelar</button>
            </div>
        </form>
    </div>
    {% else %}
        <p>Nenhum produto cadastrado.</p>
    {% endfor %}
</div>
    <script>
        function abrirEdicao(id) {
            document.getElementById('form-' + id).style.display = 'block';
        }

        function fecharEdicao(id) {
            document.getElementById('form-' + id).style.display = 'none';
        }

        function confirmarDelete(id, nome) {
    const confirmou = confirm(`Tem certeza que deseja excluir o produto "${nome}"?`);

    if (confirmou) {
        // Cria um formulário temporário e envia
        const form = document.createElement('form');
        form.method = 'POST';
        form.action = '/deletar';

        const input = document.createElement('input');
        input.type = 'hidden';
        input.name = 'id';
        input.value = id;

        form.appendChild(input);
        document.body.appendChild(form);
        form.submit();
    }
}
    </script>

</body>
</html>
